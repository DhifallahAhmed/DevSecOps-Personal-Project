name: CI/CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: ./mvnw clean install
        working-directory: demo

      - name: Run Tests
        run: ./mvnw test
        working-directory: demo

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-backend-app:${{ github.sha }} .
        working-directory: demo
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/my-backend-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-backend-app:${{ github.sha }}

      - name: Trigger Render Deployment
        run: curl -X GET "${{ secrets.RENDER_DEPLOY_HOOK }}"
  frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install
        working-directory: my-svelte-app

      - name: Audit for vulnerabilities
        run: pnpm audit --audit-level=high
        working-directory: my-svelte-app

      - name: Lint Code
        run: pnpm run lint
        working-directory: my-svelte-app

      - name: Build Svelte App
        run: pnpm run build
        working-directory: my-svelte-app

      - name: Deploy to Netlify
        run: curl -X POST -d {} "${{ secrets.NETLIFY_BUILD_HOOK }}"
